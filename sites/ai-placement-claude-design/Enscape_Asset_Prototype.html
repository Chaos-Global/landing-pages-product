  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

B3B3B;  /* 3 */\n  --dark-grey:          #525252;  /* 4 — secondary text */\n  --grey:               #828282;  /* 5 — tertiary text / muted */\n  --mid-grey:           #ABABAB;  /* 6 — disabled */\n  --light-grey:         #DBDBDB;  /* 7 — borders */\n  --lighter-grey:       #EDEDED;  /* 8 — dividers */\n  --almost-white:       #F6F6F6;  /* 9 — surfaces / app bg */\n  --white:              #FFFFFF;  /* 10 */\n\n  /* ============ UTILITY COLORS — semantic, with dark-theme variants ============ */\n  --blue:               #0DB5FF;  /* CL4 — primary info / link */\n  --blue-dark-theme:    #17A2DF;  /* CL3 — slightly darker for dark bg */\n  --blue-deepest:       #364951;  /* BD — utility dark surface */\n  --red:                #E1161C;  /* C3 — danger / destructive */\n  --red-dark-theme:     #E74549;  /* C4 — destructive on dark bg */\n  --orange:             #F3712B;  /* CR3 — warning */\n  --green:              #77B22A;  /* V3 — success */\n\n  /* ============ PRODUCT COLORS — base step (3, the \"default\" tone) ============ */\n  --chaos-red:          #E1161C;  /* C  — Chaos master brand */\n  --vray-blue:          #2857AF;  /* VR — V-Ray */\n  --vantage-green:      #77B22A;  /* V  — Vantage */\n  --phoenix-yellow:     #F3B830;  /* P  — Phoenix */\n  --corona-orange:      #F3712B;  /* CR — Corona */\n  --enscape-apricot:    #F7941D;  /* EN — Enscape */\n  --cosmos-purple:      #714AB5;  /* CO — Cosmos */\n  --cylindo-teal:       #00B0BD;  /* CY — Cylindo */\n  --player-teal:        #12988B;  /* PL — Player */\n  --scans-plum:         #9E3988;  /* S  — Scans */\n  --scatter-green:      #A6BD39;  /* SC — Scatter */\n  --cloud-blue:         #17A2DF;  /* CL — Cloud */\n  --veras-blue:         #207DC7;  /* VE — Veras (AI image gen) */\n\n  /* ============ SEMANTIC TOKENS — light theme (default) ============ */\n  --fg-1:               var(--chaos-black);   /* primary text */\n  --fg-2:               var(--dark-grey);     /* secondary text */\n  --fg-3:               var(--grey);          /* tertiary text / labels */\n  --fg-muted:           var(--mid-grey);      /* disabled / muted */\n  --fg-inverse:         var(--white);\n\n  --bg-app:             var(--almost-white);\n  --bg-surface:         var(--white);\n  --bg-subtle:          var(--almost-white);\n  --bg-hover:           var(--lighter-grey);\n  --bg-inverse:         var(--chaos-black);\n\n  --border-1:           var(--light-grey);    /* default border */\n  --border-2:           var(--lighter-grey);  /* subtle / dividers */\n  --border-strong:      var(--chaos-black);   /* secondary button outline */\n\n  --accent:             var(--blue);          /* link / info accent */\n  --accent-hover:       #1681BD;\n  --accent-pressed:     #085982;\n\n  --danger:             var(--red);\n  --danger-hover:       #B5161C;\n  --danger-pressed:     #850305;\n\n  --success:            var(--green);\n  --warning:            var(--orange);\n\n  /* ============ TYPOGRAPHY ============ */\n  --font-sans: \"Poppins\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif;\n  --font-mono: ui-monospace, \"SF Mono\", Menlo, Monaco, Consolas, monospace;\n\n  /* Scale — pulled directly from Figma type spec (Poppins).\n     Line-height: 1.20 for display, 1.40 for headings, 1.55 for body. */\n  --fs-h1-big:    72.93px;\n  --fs-h1-small:  54.71px;\n  --fs-h2:        41.05px;\n  --fs-h3:        30.79px;\n  --fs-h4:        23.10px;   /* large body / lead */\n  --fs-body-lg:   17.33px;   /* body large */\n  --fs-body:      14.50px;   /* body */\n  --fs-sm:        13.00px;   /* button labels / dense ui */\n  --fs-xs:        11.00px;   /* captions / labels */\n  --fs-xxs:       9.75px;    /* micro labels */\n\n  --lh-display:   1.20;\n  --lh-heading:   1.40;\n  --lh-body:      1.55;\n\n  --fw-regular:   400;\n  --fw-medium:    500;\n  --fw-bold:      700;\n\n  /* ============ SPACING — 4-pt scale built around button paddings ============ */\n  --sp-0:    0;\n  --sp-1:    4px;\n  --sp-2:    8px;\n  --sp-3:    10px;   /* common gap */\n  --sp-4:    13px;   /* button vertical pad */\n  --sp-5:    15px;\n  --sp-6:    20px;\n  --sp-7:    25px;\n  --sp-8:    30px;   /* modal padding */\n  --sp-9:    40px;   /* button horizontal pad */\n  --sp-10:   50px;\n  --sp-12:   80px;\n  --sp-16:   100px;  /* page gutter */\n\n  /* ============ RADII ============ */\n  --r-xs:    2px;\n  --r-sm:    4px;    /* default surface / card / input */\n  --r-md:    5px;    /* button container, panels */\n  --r-lg:    8px;\n  --r-pill:  100px;  /* primary/secondary buttons */\n  --r-full:  9999px;\n\n  /* ============ SHADOWS — minimal; soft, neutral ============ */\n  --shadow-none:    none;\n  --shadow-sm:      0 1px 2px rgba(28,28,28,.06);\n  --shadow-md:      0 2px 8px rgba(28,28,28,.10);\n  --shadow-modal:   0 4px 20px rgba(28,28,28,.30);   /* from modal spec */\n  --shadow-popover: 0 4px 16px rgba(28,28,28,.20);\n\n  /* ============ TRANSITIONS ============ */\n  --ease-out:       cubic-bezier(.2,.7,.2,1);\n  --t-fast:         120ms var(--ease-out);\n  --t-base:         180ms var(--ease-out);\n}\n\n/* ============ DARK THEME (apply via [data-theme=\"dark\"]) ============ */\n[data-theme=\"dark\"] {\n  --fg-1:           var(--white);\n  --fg-2:           var(--light-grey);\n  --fg-3:           var(--mid-grey);\n  --fg-muted:       var(--grey);\n  --fg-inverse:     var(--chaos-black);\n\n  --bg-app:         var(--chaos-black);\n  --bg-surface:     var(--almost-black);\n  --bg-subtle:      var(--darker-grey);\n  --bg-hover:       var(--dark-grey);\n  --bg-inverse:     var(--white);\n\n  --border-1:       var(--darker-grey);\n  --border-2:       var(--almost-black);\n  --border-strong:  var(--white);\n\n  --accent:         var(--blue);\n  --danger:         var(--red-dark-theme);\n}\n\n/* ============ SEMANTIC TYPE — drop-in element styles ============ */\n.h1, h1 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-h1-big);\n  line-height: var(--lh-display);\n  color: var(--fg-1);\n  letter-spacing: -.01em;\n}\n.h2, h2 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-h2);\n  line-height: var(--lh-heading);\n  color: var(--fg-1);\n}\n.h3, h3 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-h3);\n  line-height: var(--lh-heading);\n  color: var(--fg-1);\n}\n.h4, h4 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-h4);\n  line-height: var(--lh-heading);\n  color: var(--fg-1);\n}\n.lead {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-body-lg);\n  line-height: var(--lh-body);\n  color: var(--fg-2);\n}\n.p, p {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--fg-1);\n}\n.small, small {\n  font-family: var(--font-sans);\n  font-size: var(--fs-sm);\n  line-height: var(--lh-body);\n  color: var(--fg-2);\n}\n.caption {\n  font-family: var(--font-sans);\n  font-size: var(--fs-xs);\n  line-height: var(--lh-body);\n  color: var(--fg-3);\n  letter-spacing: .02em;\n}\n.eyebrow {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-xs);\n  line-height: 1.4;\n  color: var(--fg-3);\n  text-transform: uppercase;\n  letter-spacing: .12em;\n}\n\n/* ============ BUTTON BASE — three sizes × primary/secondary/text × default/red ============ */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--sp-3);\n  font-family: var(--font-sans);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-sm);\n  line-height: var(--lh-body);\n  border-radius: var(--r-pill);\n  border: 2px solid transparent;\n  cursor: pointer;\n  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);\n  white-space: nowrap;\n  user-select: none;\n}\n.btn--lg  { padding: 13px 40px; font-size: var(--fs-sm); }\n.btn--md  { padding: 9px 30px; }\n.btn--sm  { padding: 7px 22px;  font-size: var(--fs-xs); }\n.btn--xs  { padding: 5px 16px;  font-size: var(--fs-xs); }\n\n.btn--primary {\n  background: var(--bg-inverse);\n  color: var(--fg-inverse);\n  border-color: var(--bg-inverse);\n}\n.btn--primary:hover { filter: brightness(.85); }\n.btn--primary:active { filter: brightness(.7); }\n.btn--primary:disabled { background: var(--mid-grey); border-color: var(--mid-grey); color: var(--white); cursor: not-allowed; filter: none; }\n\n.btn--secondary {\n  background: transparent;\n  color: var(--fg-1);\n  border-color: var(--border-strong);\n}\n.btn--secondary:hover { background: var(--bg-inverse); color: var(--fg-inverse); }\n.btn--secondary:active { background: var(--dark-grey); border-color: var(--dark-grey); color: var(--white); }\n\n.btn--danger {\n  background: var(--danger);\n  color: var(--white);\n  border-color: var(--danger);\n}\n.btn--danger:hover { background: var(--danger-hover); border-color: var(--danger-hover); }\n.btn--danger:active { background: var(--danger-pressed); border-color: var(--danger-pressed); }\n\n.btn--text {\n  background: transparent;\n  color: var(--fg-1);\n  border-color: transparent;\n  padding-left: var(--sp-3);\n  padding-right: var(--sp-3);\n}\n.btn--text:hover { color: var(--fg-2); }\n<\u002Fstyle>\n\n<style>\n  /* ---------- Reset / shell ---------- */\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }\n  body {\n    background: #0E0E10;\n    color: var(--fg-1);\n    font-family: var(--font-sans);\n    font-size: var(--fs-body);\n    line-height: var(--lh-body);\n    -webkit-font-smoothing: antialiased;\n  }\n\n  /* Slightly tuned dark palette for a \"refined\" feel */\n  :root {\n    --app-bg: #0E0E10;\n    --chrome-bg: #161618;\n    --panel-bg: #1A1A1F;\n    --panel-elev: #1F1F25;\n    --hairline: #26262C;\n    --hairline-strong: #33333B;\n    --ink-1: #F1F1F3;\n    --ink-2: #B7B7BE;\n    --ink-3: #71717A;\n    --ink-4: #4A4A53;\n    --accent-cool: #6B8AA6;\n    --accent-warm: var(--enscape-apricot);\n  }\n\n  /* ---------- Top titlebar (simulated host chrome) ---------- */\n  .app {\n    display: grid;\n    grid-template-rows: 36px 1fr;\n    grid-template-columns: 48px 1fr 400px;\n    grid-template-areas:\n      \"title  title  title\"\n      \"rail   view   panel\";\n    height: 100vh;\n  }\n  .titlebar {\n    grid-area: title;\n    background: var(--chrome-bg);\n    border-bottom: 1px solid var(--hairline);\n    display: flex; align-items: center;\n    padding: 0 12px;\n    gap: 16px;\n    font-size: 12px;\n    color: var(--ink-2);\n    user-select: none;\n  }\n  .titlebar .logo {\n    width: 18px; height: 18px;\n    background: var(--enscape-apricot);\n    border-radius: 3px;\n    display: grid; place-items: center;\n    color: #fff; font-weight: 700; font-size: 11px;\n  }\n  .titlebar .menu { display:flex; gap: 14px; color: var(--ink-2); font-size: 12px; }\n  .titlebar .menu span { cursor: default; }\n  .titlebar .scene { margin-left: auto; color: var(--ink-3); font-family: var(--font-mono); font-size: 11px; letter-spacing: .02em; }\n  .titlebar .win { display: flex; gap: 8px; margin-left: 16px; }\n  .titlebar .win span { width: 12px; height: 12px; border-radius: 50%; background: var(--ink-4); }\n\n  /* ---------- Left rail (host tool icons) ---------- */\n  .rail {\n    grid-area: rail;\n    background: var(--chrome-bg);\n    border-right: 1px solid var(--hairline);\n    display: flex; flex-direction: column;\n    align-items: center; padding: 12px 0; gap: 6px;\n  }\n  .rail button {\n    width: 32px; height: 32px;\n    border: 0;\n    background: transparent;\n    color: var(--ink-3);\n    border-radius: 6px;\n    cursor: pointer;\n    display: grid; place-items: center;\n    transition: background var(--t-fast), color var(--t-fast);\n  }\n  .rail button:hover { background: var(--hairline); color: var(--ink-1); }\n  .rail button.active { background: var(--panel-bg); color: var(--enscape-apricot); }\n  .rail .spacer { flex: 1; }\n  .rail svg { width: 18px; height: 18px; }\n\n  /* ---------- Viewport ---------- */\n  .viewport {\n    grid-area: view;\n    position: relative;\n    background:\n      radial-gradient(ellipse at 50% 30%, #1d1d22 0%, #0E0E10 70%);\n    overflow: hidden;\n  }\n  /* Perspective grid floor */\n  .floor {\n    position: absolute;\n    inset: 35% -20% 0 -20%;\n    background:\n      linear-gradient(to right, rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 60px 60px,\n      linear-gradient(to bottom, rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 60px 60px;\n    transform: perspective(800px) rotateX(60deg);\n    transform-origin: 50% 0;\n    mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent 80%);\n    pointer-events: none;\n  }\n  /* Subtle ambient horizon glow */\n  .horizon {\n    position: absolute; left: 0; right: 0; top: 32%; height: 1px;\n    background: linear-gradient(to right, transparent, rgba(247,148,29,.18), transparent);\n    pointer-events: none;\n  }\n\n  /* Wireframe ghost objects placed in the scene */\n  .scene-obj {\n    position: absolute;\n    border: 1px solid rgba(255,255,255,.18);\n    background: rgba(20,20,24,.4);\n    backdrop-filter: blur(2px);\n    transition: border-color var(--t-base), box-shadow var(--t-base);\n  }\n  .scene-obj.highlight {\n    border-color: var(--enscape-apricot);\n    box-shadow: 0 0 0 1px rgba(247,148,29,.35), 0 0 40px rgba(247,148,29,.25);\n  }\n  .scene-obj .label {\n    position: absolute;\n    top: -22px; left: 0;\n    font-family: var(--font-mono); font-size: 10px;\n    color: var(--ink-2);\n    background: rgba(28,28,28,.85);\n    border: 1px solid var(--hairline);\n    padding: 2px 6px; border-radius: 3px;\n    white-space: nowrap;\n  }\n  .scene-obj.highlight .label {\n    color: var(--enscape-apricot);\n    border-color: rgba(247,148,29,.35);\n  }\n  .scene-obj .pin {\n    position: absolute; top: -22px; left: -1px;\n    width: 6px; height: 6px; border-radius: 50%;\n    background: var(--enscape-apricot);\n    opacity: 0; transition: opacity var(--t-base);\n  }\n  .scene-obj.highlight .pin { opacity: 1; }\n\n  /* Viewport HUD */\n  .viewport-hud {\n    position: absolute; top: 12px; left: 12px; right: 12px;\n    display: flex; justify-content: space-between;\n    pointer-events: none;\n    font-family: var(--font-mono); font-size: 10px;\n    color: var(--ink-3);\n    letter-spacing: .04em;\n  }\n  .viewport-hud .pill {\n    background: rgba(22,22,24,.7);\n    border: 1px solid var(--hairline);\n    padding: 4px 8px; border-radius: 3px;\n    pointer-events: auto;\n  }\n  .viewport-hud .res { color: var(--ink-2); }\n  .viewport-hud .fps { color: var(--vantage-green); }\n\n  /* Bottom viewport status */\n  .viewport-status {\n    position: absolute; bottom: 0; left: 0; right: 0;\n    background: var(--chrome-bg);\n    border-top: 1px solid var(--hairline);\n    height: 28px;\n    display: flex; align-items: center;\n    padding: 0 12px;\n    gap: 16px;\n    font-family: var(--font-mono);\n    font-size: 10px; color: var(--ink-3);\n    letter-spacing: .03em;\n  }\n  .viewport-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--vantage-green); margin-right: 4px; display: inline-block; }\n  .viewport-status .spacer { flex: 1; }\n\n  /* Floating placement preview marker (when hovering an asset card) */\n  .placement-marker {\n    position: absolute;\n    width: 64px; height: 64px;\n    border: 1px dashed var(--enscape-apricot);\n    background: rgba(247,148,29,.08);\n    transform: translate(-50%, -50%);\n    pointer-events: none;\n    opacity: 0;\n    transition: opacity var(--t-base);\n  }\n  .placement-marker.show { opacity: 1; }\n  .placement-marker::before, .placement-marker::after {\n    content: ''; position: absolute; background: var(--enscape-apricot);\n  }\n  .placement-marker::before { rosted glass pendant, brass cap<\u002Fbutton>\n          <button class=\"chip\">Sculptural ceramic vase, terracotta<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div class=\"eyebrow-row\"><span>Activity<\u002Fspan><span class=\"line\"><\u002Fspan><\u002Fdiv>\n\n        <div class=\"gen-bar\" id=\"genBar\" style=\"display:none;\">\n          <div class=\"gen-head\">\n            <div class=\"gen-h\" id=\"genHeadText\">Generating asset<\u002Fdiv>\n            <div class=\"gen-meta\" id=\"genMeta\">0%<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"progress\"><div id=\"genFill\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"gen-stage\" id=\"genStage\">Initializing diffusion ·<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"gen-result\" id=\"genResult\">\n          <div class=\"gen-thumb\" id=\"genThumb\">\n            <span class=\"badge\">Generated<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"gen-meta-row\">\n            <div>\n              <div class=\"gen-name\" id=\"genName\">Untitled Asset<\u002Fdiv>\n              <div class=\"mono\" style=\"font-size:10px; color: var(--ink-3); margin-top:2px;\">Furniture · 1.2k tris · 4K PBR<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"gen-actions\">\n              <button>Regenerate<\u002Fbutton>\n              <button class=\"primary\">Place<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"genEmpty\" class=\"muted\" style=\"font-size: 12px; text-align: center; padding: 24px 8px; line-height: 1.6;\">\n          No generations yet.<br>\n          <span class=\"mono\" style=\"font-size: 10px; color: var(--ink-4);\">Outputs are saved to your scene library.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n  <\u002Faside>\n<\u002Fdiv>\n\n<script>\n// ============================================================\n// ASSET DATA\n// ============================================================\nconst ASSETS = [\n  { id:1,  name:\"Eames Lounge Chair\",        category:\"Furniture\",  tags:[\"mid-century\",\"leather\",\"indoor\"],   style:\"modern\",      glyph:\"chair\", color:\"#6b4a32\", zone:\"corner\" },\n  { id:2,  name:\"White Oak Dining Table\",    category:\"Furniture\",  tags:[\"scandinavian\",\"wood\",\"minimal\"],     style:\"scandinavian\", glyph:\"table\", color:\"#b89572\", zone:\"dining\" },\n  { id:3,  name:\"Fiddle Leaf Fig\",           category:\"Vegetation\", tags:[\"indoor\",\"large\",\"tropical\"],         style:\"organic\",     glyph:\"plant\", color:\"#3f6b3a\", zone:\"corner\" },\n  { id:4,  name:\"Pendant Lamp — Brass\",      category:\"Lighting\",   tags:[\"warm\",\"metal\",\"statement\"],          style:\"modern\",      glyph:\"pendant\", color:\"#c19a4a\", zone:\"ceiling\" },\n  { id:5,  name:\"Scandi Dining Chair\",       category:\"Furniture\",  tags:[\"scandinavian\",\"light wood\",\"oak\"],   style:\"scandinavian\", glyph:\"chair\", color:\"#c8a17a\", zone:\"dining\" },\n  { id:6,  name:\"Standing Man — Casual\",     category:\"People\",     tags:[\"casual\",\"portrait\",\"male\"],          style:\"realistic\",   glyph:\"person\", color:\"#3a4a5a\", zone:null },\n  { id:7,  name:\"Boucle Sofa — Cream\",       category:\"Furniture\",  tags:[\"bouclé\",\"minimal\",\"light\"],          style:\"minimal\",     glyph:\"sofa\",  color:\"#cdbf9d\", zone:\"sofa\" },\n  { id:8,  name:\"Travertine — Honed\",        category:\"Materials\",  tags:[\"stone\",\"beige\",\"natural\"],           style:\"natural\",     glyph:\"swatch\", color:\"#a59076\", zone:null },\n  { id:9,  name:\"Olive Tree — Potted\",       category:\"Vegetation\", tags:[\"mediterranean\",\"silver\",\"outdoor\"],  style:\"mediterranean\", glyph:\"plant\", color:\"#7a7a4a\", zone:\"corner\" },\n  { id:10, name:\"Floor Lamp — Linen Shade\",  category:\"Lighting\",   tags:[\"floor\",\"linen\",\"warm\"],              style:\"contemporary\", glyph:\"floorlamp\", color:\"#b39264\", zone:\"corner\" },\n  { id:11, name:\"Wool Rug — Natural\",        category:\"Materials\",  tags:[\"wool\",\"beige\",\"textured\"],           style:\"natural\",     glyph:\"swatch\", color:\"#b7a685\", zone:null },\n  { id:12, name:\"Tesla Model S\",             category:\"Vehicles\",   tags:[\"sedan\",\"ev\",\"modern\"],               style:\"modern\",      glyph:\"car\",   color:\"#2c3035\", zone:null },\n  { id:13, name:\"Wall Sconce — Matte Black\", category:\"Lighting\",   tags:[\"minimal\",\"metal\",\"cool\"],            style:\"modern\",      glyph:\"sconce\", color:\"#2a2a2c\", zone:\"wall\" },\n  { id:14, name:\"Monstera Deliciosa\",        category:\"Vegetation\", tags:[\"indoor\",\"tropical\",\"large\"],         style:\"organic\",     glyph:\"plant\", color:\"#436a3d\", zone:\"corner\" },\n  { id:15, name:\"Walnut Bookshelf\",          category:\"Furniture\",  tags:[\"walnut\",\"tall\",\"storage\"],           style:\"modern\",      glyph:\"shelf\", color:\"#5c3d28\", zone:\"wall\" },\n  { id:16, name:\"Woman with Laptop\",         category:\"People\",     tags:[\"seated\",\"laptop\",\"female\"],          style:\"realistic\",   glyph:\"person\", color:\"#4a5a6a\", zone:null },\n  { id:17, name:\"Framed Artwork — Ochre\",    category:\"Materials\",  tags:[\"art\",\"print\",\"warm\"],                style:\"contemporary\", glyph:\"frame\", color:\"#b3793a\", zone:\"wall\" },\n  { id:18, name:\"Persian Rug — Faded\",       category:\"Materials\",  tags:[\"rug\",\"vintage\",\"red\"],               style:\"vintage\",     glyph:\"swatch\", color:\"#7a3a2a\", zone:null },\n];\n\n// ============================================================\n// SVG glyphs for thumbnails — minimal silhouettes\n// ============================================================\nfunction thumbSvg(asset) {\n  const c = asset.color;\n  // Each glyph is on a tinted background of the asset's color, with a silhouette in slightly darker shade\n  const bgGrad = `\n    <defs>\n      <linearGradient id=\"g${asset.id}\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0%\" stop-color=\"${shade(c, 0.4)}\" stop-opacity=\".22\"/>\n        <stop offset=\"100%\" stop-color=\"${shade(c, -0.2)}\" stop-opacity=\".05\"/>\n      <\u002FlinearGradient>\n    <\u002Fdefs>`;\n  const bg = `<rect width=\"100\" height=\"100\" fill=\"url(#g${asset.id})\"/>`;\n  const fg = (() => {\n    const stroke = shade(c, 0.5);\n    const fill = c;\n    switch (asset.glyph) {\n      case 'chair': return `<g stroke=\"${stroke}\" stroke-width=\"1.5\" fill=\"${fill}\" fill-opacity=\".5\"><rect x=\"35\" y=\"40\" width=\"30\" height=\"34\" rx=\"2\"/><rect x=\"34\" y=\"70\" width=\"32\" height=\"6\"/><line x1=\"38\" y1=\"76\" x2=\"38\" y2=\"90\" stroke-width=\"2\"/><line x1=\"62\" y1=\"76\" x2=\"62\" y2=\"90\" stroke-width=\"2\"/><\u002Fg>`;\n      case 'table': return `<g stroke=\"${stroke}\" stroke-width=\"1.5\" fill=\"${fill}\" fill-opacity=\".5\"><rect x=\"20\" y=\"50\" width=\"60\" height=\"6\"/><rect x=\"24\" y=\"56\" width=\"3\" height=\"22\"/><rect x=\"73\" y=\"56\" width=\"3\" height=\"22\"/><\u002Fg>`;\n      case 'plant': return `<g><path d=\"M50 80 L50 50\" stroke=\"${stroke}\" stroke-width=\"1.5\"/><ellipse cx=\"42\" cy=\"40\" rx=\"14\" ry=\"10\" fill=\"${fill}\" fill-opacity=\".6\" transform=\"rotate(-30 42 40)\"/><ellipse cx=\"58\" cy=\"42\" rx=\"14\" ry=\"10\" fill=\"${fill}\" fill-opacity=\".5\" transform=\"rotate(35 58 42)\"/><ellipse cx=\"50\" cy=\"32\" rx=\"13\" ry=\"9\" fill=\"${fill}\" fill-opacity=\".7\"/><rect x=\"42\" y=\"78\" width=\"16\" height=\"10\" fill=\"${shade(c,-0.3)}\" stroke=\"${stroke}\" stroke-width=\"1\"/><\u002Fg>`;\n      case 'pendant': return `<g><line x1=\"50\" y1=\"20\" x2=\"50\" y2=\"40\" stroke=\"${stroke}\" stroke-width=\"1\"/><path d=\"M35 60 Q35 40 50 40 Q65 40 65 60 Z\" fill=\"${fill}\" fill-opacity=\".7\" stroke=\"${stroke}\" stroke-width=\"1.5\"/><ellipse cx=\"50\" cy=\"60\" rx=\"15\" ry=\"3\" fill=\"${shade(c,-0.3)}\"/><\u002Fg>`;\n      case 'sofa': return `<g stroke=\"${stroke}\" stroke-width=\"1.5\" fill=\"${fill}\" fill-opacity=\".5\"><rect x=\"18\" y=\"50\" width=\"64\" height=\"22\" rx=\"4\"/><rect x=\"18\" y=\"44\" width=\"64\" height=\"14\" rx=\"3\"/><rect x=\"14\" y=\"50\" width=\"8\" height=\"22\" rx=\"3\"/><rect x=\"78\" y=\"50\" width=\"8\" height=\"22\" rx=\"3\"/><\u002Fg>`;\n      case 'person': return `<g stroke=\"${stroke}\" stroke-width=\"1.4\" fill=\"${fill}\" fill-opacity=\".55\"><circle cx=\"50\" cy=\"32\" r=\"8\"/><path d=\"M50 40 Q42 50 40 78 L60 78 Q58 50 50 40 Z\"/><\u002Fg>`;\n      case 'swatch': return `<g><rect x=\"20\" y=\"20\" width=\"60\" height=\"60\" fill=\"${fill}\" fill-opacity=\".7\"/><rect x=\"20\" y=\"20\" width=\"60\" height=\"60\" fill=\"url(#noise${asset.id})\" /><defs><pattern id=\"noise${asset.id}\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\"><path d=\"M0 6 L6 0\" stroke=\"${stroke}\" stroke-width=\".4\" opacity=\".5\"/><\u002Fpattern><\u002Fdefs><\u002Fg>`;\n      case 'floorlamp': return `<g stroke=\"${stroke}\" stroke-width=\"1.5\" fill=\"${fill}\" fill-opacity=\".5\"><path d=\"M40 30 L60 30 L55 50 L45 50 Z\"/><line x1=\"50\" y1=\"50\" x2=\"50\" y2=\"80\"/><rect x=\"42\" y=\"80\" width=\"16\" height=\"3\"/><\u002Fg>`;\n      case 'car': return `<g stroke=\"${stroke}\" stroke-width=\"1.5\" fill=\"${fill}\" fill-opacity=\".55\"><path d=\"M18 60 Q18 50 25 48 L40 42 L60 42 L75 48 Q82 50 82 60 L82 65 L18 65 Z\"/><circle cx=\"32\" cy=\"68\" r=\"5\" fill=\"${shade(c,-0.4)}\"/><circle cx=\"68\" cy=\"68\" r=\"5\" fill=\"${shade(c,-0.4)}\"/><\u002Fg>`;\n      case 'sconce': return `<g stroke=\"${stroke}\" stroke-width=\"1.5\" fill=\"${fill}\" fill-opacity=\".6\"><rect x=\"42\" y=\"40\" width=\"16\" height=\"20\"/><path d=\"M30 38 L70 38 L65 30 L35 30 Z\" opacity=\".7\"/><\u002Fg>`;\n      case 'shelf': return `<g stroke=\"${stroke}\" stroke-width=\"1.5\" fill=\"${fill}\" fill-opacity=\".5\"><rect x=\"30\" y=\"18\" width=\"40\" height=\"64\"/><line x1=\"30\" y1=\"32\" x2=\"70\" y2=\"32\"/><line x1=\"30\" y1=\"48\" x2=\"70\" y2=\"48\"/><line x1=\"30\" y1=\"64\" x2=\"70\" y2=\"64\"/><\u002Fg>`;\n      case 'frame': return `<g stroke=\"${stroke}\" stroke-width=\"1.5\" fill=\"${fill}\" fill-opacity=\".6\"><rect x=\"28\" y=\"22\" width=\"44\" height=\"56\"/><rect x=\"34\" y=\"28\" width=\"32\" height=\"44\" fill=\"${shade(c,0.3)}\" fill-opacity=\".4\"/><\u002Fg>`;\n      default: return `<rect x=\"30\" y=\"30\" width=\"40\" height=\"40\" fill=\"${fill}\" fill-opacity=\".6\"/>`;\n    }\n  })();\n  return `<svg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" preserveAspectRatio=\"xMidYMid slice\">${bgGrad}${bg}${fg}<\u002Fsvg>`;\n}\nfunction shade(hex, amt) {\n  const n = parseInt(hex.slice(1), 16);\n  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;\n  r = Math.max(0, Math.min(255, r + Math.round(amt * 255)));\n  g = Math.max(0, Math.min(255, g + Math.round(amt * 255)));\n  b = Math.max(0, Math.min(255, b + Math.round(amt * 255)));\n  return '#' + ((1<<24) | (r<<16) | (g<<8) | b).toString(16).slice(1);\n}\n\n// ============================================================\n// CARD RENDER\n// ============================================================\nfunction cardHtml(asset) {\n  return `\n    <article class=\"card\" data-id=\"${asset.id}\" data-zone=\"${asset.zone||''}\">\n      <div class=\"thumb\">\n        <div class=\"cat-tag\">${asset.category}<\u002Fdiv>\n        ${thumbSvg(asset)}\n        <button class=\"place-btn\" data-action=\"place\">\n          <svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M6 2v8M2 6h8\"/><\u002Fsvg>\n          Place\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"card-meta\">\n        <p class=\"name\">${asset.name}<\u002Fp>\n        <div class=\"tags\">${asset.tags.slice(0,2).map(t=>`<span class=\"tag\">${t.replace(/\\s+/g,'-')}<\u002Fspan>`).join('')}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>`;\n}\n\n// ============================================================\n// PLACED COUNTER\n// ============================================================\nlet placedCount = 0;\nfunction bumpPlaced() {\n  placedCount++;\n  document.getElementById('placedCount').textContent =\n    `${placedCount} ASSET${placedCount===1?'':'S'} PLACED THIS SESSION`;\n}\n\n// ============================================================\n// VIEWPORT HIGHLIGHTS + placement marker\n// ============================================================\nconst viewport = document.getElementById('viewport');\nconst marker = document.getElementById('placementMarker');\n\nfunction highlightZone(zone) {\n  document.querySelectorAll('.scene-obj').forEach(el => {\n    el.classList.toggle('highlight', zone && el.dataset.zone === zone);\n  });\n}\nfunction clearHighlights() {\n  document.querySelectorAll('.scene-obj').forEach(el => el.classList.remove('highlight'));\n}\nfunction showPlacementAt(zone) {\n  if (!zone) { marker.classList.remove('show'); return; }\n  const target = document.querySelector(`.scene-obj[data-zone=\"${zone}\"]`);\n  if (!target) { marker.classList.remove('show'); return; }\n  const vRect = viewport.getBoundingClientRect();\n  const tRect = target.getBoundingClientRect();\n  marker.style.left = (tRect.left + tRect.width/2 - vRect.left) + 'px';\n  marker.style.top  = (tRect.top  + tRect.height/2 - vRect.top) + 'px';\n  marker.classList.add('show');\n}\n\n// Card hover delegation\nfunction attachCardHover(root) {\n  root.querySelectorAll('.card').forEach(card => {\n    const zone = card.dataset.zone || null;\n    card.addEventListener('mouseenter', () => { highlightZone(zone); showPlacementAt(zone); });\n    card.addEventListener('mouseleave', () => { clearHighlights(); marker.classList.remove('show'); });\n    const placeBtn = card.querySelector('[data-action=\"place\"]');\n    if (placeBtn) {\n      placeBtn.addEventListener('click', e => {\n        e.stopPropagation();\n        placeBtn.classList.add('placed');\n        placeBtn.innerHTML = `<svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 6.5L5 9.5L10 3.5\"/><\u002Fsvg> Placed`;\n        bumpPlaced();\n        setTimeout(()=> {\n          placeBtn.classList.remove('placed');\n          placeBtn.innerHTML = `<svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M6 2v8M2 6h8\"/><\u002Fsvg> Place`;\n        }, 1600);\n      });\n    }\n  });\n}\n\n// ============================================================\n// TABS\n// ============================================================\ndocument.querySelectorAll('.tab').forEach(t => {\n  t.addEventListener('click', () => {\n    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));\n    document.querySelectorAll('.pane').forEach(x => x.classList.remove('active'));\n    t.classList.add('active');\n    const pane = document.querySelector(`.pane[data-pane=\"${t.dataset.tab}\"]`);\n    pane.classList.add('active');\n    clearHighlights(); marker.classList.remove('show');\n  });\n});\n\n// ============================================================\n// PATTERN A — prompt-driven search\n// ============================================================\nconst promptInput = document.getElementById('promptInput');\nconst promptSend  = document.getElementById('promptSend');\nconst thread      = document.getElementById('thread');\nconst suggestionRow = document.getElementById('suggestionRow');\n\nsuggestionRow.querySelectorAll('.chip').forEach(c => {\n  c.addEventListener('click', () => {\n    promptInput.value = c.textContent.trim();\n    promptInput.focus();\n  });\n});\n\nfunction parsePrompt(p) {\n  const txt = p.toLowerCase();\n  const out = [];\n  const styleMap = ['scandinavian','mid-century','minimal','modern','natural','organic','contemporary','mediterranean','vintage'];\n  for (const s of styleMap) if (txt.includes(s)) out.push({k:'style', v:s});\n  const matMap = ['wood','leather','brass','metal','linen','wool','stone','walnut','oak','glass','ceramic'];\n  for (const m of matMap) if (txt.includes(m)) out.push({k:'material', v:m});\n  const colorMap = [['warm','warm tones'],['cool','cool tones'],['cream','cream'],['black','black'],['white','white'],['ochre','ochre']];\n  for (const [k,v] of colorMap) if (txt.includes(k)) out.push({k:'color', v:v});\n  const catMap = [['chair','Furniture'],['table','Furniture'],['sofa','Furniture'],['lamp','Lighting'],['light','Lighting'],['plant','Vegetation'],['tree','Vegetation'],['rug','Materials'],['art','Materials'],['car','Vehicles'],['person','People']];\n  for (const [k,v] of catMap) if (txt.includes(k)) { out.push({k:'category', v}); break; }\n  if (!out.length) out.push({k:'intent', v:'browse'});\n  return out;\n}\n\nfunction scoreAssets(prompt) {\n  const txt = prompt.toLowerCase();\n  return ASSETS\n    .map(a => {\n      let score = 0;\n      for (const tag of a.tags) if (txt.includes(tag.toLowerCase())) score += 3;\n      if (txt.includes(a.style.toLowerCase())) score += 4;\n      if (txt.includes(a.category.toLowerCase())) score += 5;\n      for (const word of a.name.toLowerCase().split(/\\W+/)) if (word && txt.includes(word)) score += 2;\n      // soft match by some keywords\n      if (txt.match(/chair/) && a.name.toLowerCase().includes('chair')) score += 4;\n      if (txt.match(/table/) && a.name.toLowerCase().includes('table')) score += 4;\n      if (txt.match(/lamp|light|pendant/) && a.category === 'Lighting') score += 3;\n      if (txt.match(/plant|tree|green/) && a.category === 'Vegetation') score += 3;\n      return { a, score };\n    })\n    .filter(x => x.score > 0)\n    .sort((x,y) => y.score - x.score)\n    .slice(0, 6)\n    .map(x => x.a);\n}\n\nfunction runPrompt(text) {\n  if (!text.trim()) return;\n  // Add user msg\n  const userDiv = document.createElement('div');\n  userDiv.className = 'msg-user';\n  userDiv.textContent = text;\n  thread.appendChild(userDiv);\n\n  // Thinking\n  const aiDiv = document.createElement('div');\n  aiDiv.className = 'msg-ai';\n  aiDiv.innerHTML = `\n    <div class=\"ai-head\"><svg class=\"spark\" viewBox=\"0 0 10 10\"><path d=\"M5 0 L6 4 L10 5 L6 6 L5 10 L4 6 L0 5 L4 4 Z\"/><\u002Fsvg> Asset library<\u002Fdiv>\n    <div class=\"thinking\"><span>Interpreting query<\u002Fspan><span class=\"dots\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fspan><\u002Fdiv>`;\n  thread.appendChild(aiDiv);\n  thread.scrollIntoView ? null : null;\n  aiDiv.scrollIntoView({behavior:'smooth', block:'end'});\n\n  setTimeout(() => {\n    const tags = parsePrompt(text);\n    const matches = scoreAssets(text);\n    const matchSrc = matches.length ? matches : ASSETS.slice(0,6);\n    aiDiv.innerHTML = `\n      <div class=\"ai-head\"><svg class=\"spark\" viewBox=\"0 0 10 10\"><path d=\"M5 0 L6 4 L10 5 L6 6 L5 10 L4 6 L0 5 L4 4 Z\"/><\u002Fsvg> Found ${matchSrc.length} assets · ${(800 + Math.random()*200|0)}ms<\u002Fdiv>\n      <div class=\"extracted\">\n        <div class=\"lbl\">Interpreted as<\u002Fdiv>\n        <div class=\"tag-grid\">${tags.map(t=>`<span class=\"e-tag\"><span class=\"k\">${t.k}:<\u002Fspan>${t.v}<\u002Fspan>`).join('')}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card-grid\">${matchSrc.map(cardHtml).join('')}<\u002Fdiv>\n    `;\n    attachCardHover(aiDiv);\n    aiDiv.scrollIntoView({behavior:'smooth', block:'end'});\n  }, 900 + Math.random()*400);\n\n  promptInput.value = '';\n}\npromptSend.addEventListener('click', () => runPrompt(promptInput.value));\npromptInput.addEventListener('keydown', e => {\n  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); runPrompt(promptInput.value); }\n});\n\n// Seed with one example so the screen isn't blank\nsetTimeout(() => {\n  promptInput.value = 'Scandinavian dining chairs, warm wood tone';\n  runPrompt(promptInput.value);\n}, 350);\n\n// ============================================================\n// PATTERN B — Visual / reference\n// ============================================================\nconst refGroups = document.getElementById('refGroups');\nconst previewBanner = document.getElementById('previewBanner');\nconst previewName = document.getElementById('previewName');\n\nfunction renderRefGroups() {\n  // Mock matched assets grouped\n  const groups = [\n    { title: 'Furniture',  count: 4, ids: [7, 15, 1, 2] },\n    { title: 'Lighting',   count: 2, ids: [4, 10] },\n    { title: 'Vegetation', count: 2, ids: [9, 14] },\n    { title: 'Materials',  count: 2, ids: [8, 17] },\n  ];\n  refGroups.innerHTML = groups.map(g => {\n    const items = g.ids.map(id => ASSETS.find(a => a.id===id)).filter(Boolean);\n    return `\n      <div class=\"group\">\n        <div class=\"group-header\">\n          <div class=\"gh-title\">${g.title}<\u002Fdiv>\n          <div class=\"gh-meta\">${items.length} MATCHES · ${(78 - Math.random()*8).toFixed(0)}% SIMILARITY<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card-grid\">${items.map(cardHtml).join('')}<\u002Fdiv>\n      <\u002Fdiv>`;\n  }).join('');\n  attachCardHover(refGroups);\n\n  // Wire up: clicking thumb area (not place btn) previews in scene\n  refGroups.querySelectorAll('.card').forEach(card => {\n    card.addEventListener('click', e => {\n      if (e.target.closest('.place-btn')) return;\n      const id = +card.dataset.id;\n      const asset = ASSETS.find(a => a.id===id);\n      if (!asset) return;\n      previewBanner.classList.add('show');\n      previewName.textContent = asset.name;\n      // toggle highlight\n      document.querySelectorAll('#refGroups .card').forEach(c => c.classList.remove('selected'));\n      card.classList.add('selected');\n      if (asset.zone) {\n        highlightZone(asset.zone); showPlacementAt(asset.zone);\n      }\n    });\n  });\n}\nrenderRefGroups();\n\n// Before/After toggle\npreviewBanner.querySelectorAll('.toggle button').forEach(b => {\n  b.addEventListener('click', () => {\n    previewBanner.querySelectorAll('.toggle button').forEach(x => x.classList.remove('on'));\n    b.classList.add('on');\n    if (b.dataset.pv === 'before') {\n      // hide existing scene objects briefly\n      document.querySelectorAll('.scene-obj').forEach(el => el.style.opacity = el.style.borderStyle === 'dashed' ? '1' : '.3');\n      clearHighlights(); marker.classList.remove('show');\n    } else {\n      document.querySelectorAll('.scene-obj').forEach(el => el.style.opacity = '');\n      const selected = document.querySelector('#refGroups .card.selected');\n      if (selected) {\n        const id = +selected.dataset.id;\n        const a = ASSETS.find(x => x.id===id);\n        if (a && a.zone) { highlightZone(a.zone); showPlacementAt(a.zone); }\n      }\n    }\n  });\n});\n\n// ============================================================\n// PATTERN C — Scene-aware suggestions\n// ============================================================\nconst ctxList = document.getElementById('ctxList');\n\nconst CTX_ELEMENTS = [\n  { key:'sofa',     status:'present', label:'Sofa detected',          sub:'4-seater · cream · west wall', suggestionIds:[18, 11] },  // suggest rugs around it\n  { key:'dining',   status:'present', label:'Dining table detected',  sub:'oak · 6 seats',                suggestionIds:[5, 4] },\n  { key:'wall',     status:'gap',     label:'Empty wall · 3.2m × 2.4m', sub:'no fixtures',                suggestionIds:[17, 13, 15] },\n  { key:'corner',   status:'gap',     label:'Empty corner',           sub:'1.4m × 1.4m · near window',    suggestionIds:[14, 3, 10] },\n  { key:'ceiling',  status:'miss',    label:'No lighting fixture',    sub:'over dining zone',             suggestionIds:[4] },\n];\n\nfunction renderCtx() {\n  ctxList.innerHTML = CTX_ELEMENTS.map((el, idx) => {\n    const items = el.suggestionIds.map(id => ASSETS.find(a => a.id===id)).filter(Boolean);\n    const dotClass = el.status === 'present' ? '' : (el.status === 'gap' ? 'gap' : 'miss');\n    const subLabel = el.status === 'present' ? 'Suggesting accents' : (el.status === 'gap' ? 'Suggestions' : 'Missing — recommended');\n    return `\n      <div class=\"ctx-elem ${idx<2 ? 'open' : (idx===2?'open':'')}\" data-zone=\"${el.key}\">\n        <div class=\"ctx-head\">\n          <span class=\"status-dot ${dotClass}\"><\u002Fspan>\n          <div>\n            <div class=\"label\">${el.label}<\u002Fdiv>\n            <div class=\"mono\" style=\"font-size:10px; color: var(--ink-3); margin-top:1px;\">${el.sub}<\u002Fdiv>\n          <\u002Fdiv>\n          <span class=\"sub\">${items.length} REC<\u002Fspan>\n          <svg class=\"chev\" viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 5l3 3 3-3\"/><\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"ctx-suggest\">\n          <div class=\"suggest-hint\">${subLabel}<\u002Fdiv>\n          <div class=\"suggest-list\">\n            ${items.map(a => `\n              <div class=\"suggest-item\" data-id=\"${a.id}\">\n                <div class=\"suggest-thumb\">${thumbSvg(a)}<\u002Fdiv>\n                <div class=\"suggest-info\">\n                  <div class=\"n\">${a.name}<\u002Fdiv>\n                  <div class=\"t\">${a.category} · ${a.tags.slice(0,2).join(' · ')}<\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"suggest-actions\">\n                  <button class=\"icon-btn-sm accept\" data-action=\"accept\" title=\"Accept\">\n                    <svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 6.5L5 9.5L10 3.5\"/><\u002Fsvg>\n                  <\u002Fbutton>\n                  <button class=\"icon-btn-sm\" data-action=\"swap\" title=\"Swap\">\n                    <svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 4h7l-2-2M10 8H3l2 2\"/><\u002Fsvg>\n                  <\u002Fbutton>\n                  <button class=\"icon-btn-sm dismiss\" data-action=\"dismiss\" title=\"Dismiss\">\n                    <svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M3 3l6 6M9 3l-6 6\"/><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>`).join('')}\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`;\n  }).join('');\n\n  // Header toggle expand/collapse\n  ctxList.querySelectorAll('.ctx-elem').forEach(el => {\n    el.querySelector('.ctx-head').addEventListener('click', () => {\n      el.classList.toggle('open');\n    });\n    // Hover the whole element to highlight the zone\n    el.addEventListener('mouseenter', () => {\n      el.classList.add('hover-active');\n      highlightZone(el.dataset.zone);\n      showPlacementAt(el.dataset.zone);\n    });\n    el.addEventListener('mouseleave', () => {\n      el.classList.remove('hover-active');\n      clearHighlights(); marker.classList.remove('show');\n    });\n  });\n  // Suggest item actions\n  ctxList.querySelectorAll('.suggest-item').forEach(item => {\n    item.addEventListener('mouseenter', e => {\n      const wrapper = item.closest('.ctx-elem');\n      if (wrapper) { highlightZone(wrapper.dataset.zone); showPlacementAt(wrapper.dataset.zone); }\n    });\n    item.querySelectorAll('button').forEach(b => {\n      b.addEventListener('click', e => {\n        e.stopPropagation();\n        const action = b.dataset.action;\n        if (action === 'accept') {\n          item.classList.add('selected');\n          bumpPlaced();\n          b.innerHTML = `<svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 6.5L5 9.5L10 3.5\"/><\u002Fsvg>`;\n          setTimeout(() => {\n            const wrapper = item.closest('.ctx-elem');\n            if (wrapper && [...wrapper.querySelectorAll('.suggest-item')].every(x => x.classList.contains('selected') || x.classList.contains('dismissed'))) {\n              wrapper.classList.add('dismissed');\n            }\n          }, 600);\n        } else if (action === 'dismiss') {\n          item.style.transition = 'opacity 200ms, max-height 200ms, padding 200ms, margin 200ms';\n          item.style.opacity = '0';\n          item.style.maxHeight = '0';\n          item.style.padding = '0';\n          item.style.margin = '0';\n          item.style.overflow = 'hidden';\n          item.classList.add('dismissed');\n        } else if (action === 'swap') {\n          const wrapper = item.closest('.ctx-elem');\n          const cat = ASSETS.find(a => a.id === +item.dataset.id)?.category;\n          if (!cat) return;\n          // Swap for next asset of same category not already in list\n          const inList = new Set([...wrapper.querySelectorAll('.suggest-item')].map(x => +x.dataset.id));\n          const candidate = ASSETS.find(a => a.category === cat && !inList.has(a.id));\n          if (candidate) {\n            item.dataset.id = candidate.id;\n            item.querySelector('.suggest-thumb').innerHTML = thumbSvg(candidate);\n            item.querySelector('.n').textContent = candidate.name;\n            item.querySelector('.t').textContent = `${candidate.category} · ${candidate.tags.slice(0,2).join(' · ')}`;\n          }\n        }\n      });\n    });\n  });\n}\nrenderCtx();\n\n// Re-scan button\ndocument.querySelector('.scan-banner .rescan').addEventListener('click', e => {\n  const btn = e.currentTarget;\n  btn.textContent = 'Scanning…';\n  btn.disabled = true;\n  setTimeout(() => {\n    btn.textContent = 'Rescan';\n    btn.disabled = false;\n  }, 1200);\n});\n\n// ============================================================\n// PATTERN D — Generation\n// ============================================================\nconst genInput = document.getElementById('genInput');\nconst genSend  = document.getElementById('genSend');\nconst genBar   = document.getElementById('genBar');\nconst genFill  = document.getElementById('genFill');\nconst genMeta  = document.getElementById('genMeta');\nconst genStage = document.getElementById('genStage');\nconst genResult= document.getElementById('genResult');\nconst genThumb = document.getElementById('genThumb');\nconst genName  = document.getElementById('genName');\nconst genEmpty = document.getElementById('genEmpty');\n\ndocument.querySelectorAll('.pane[data-pane=\"generate\"] .chip').forEach(c => {\n  c.addEventListener('click', () => {\n    genInput.value = c.textContent.trim();\n    genInput.focus();\n  });\n});\n\nfunction runGeneration(prompt) {\n  if (!prompt.trim()) return;\n  genResult.classList.remove('show');\n  genEmpty.style.display = 'none';\n  genBar.style.display = 'block';\n  genFill.style.width = '0%';\n  genMeta.textContent = '0%';\n\n  const stages = [\n    'Parsing prompt',\n    'Initializing diffusion',\n    'Generating geometry',\n    'Resolving UV map',\n    'Baking PBR textures',\n    'Optimizing mesh',\n    'Finalizing'\n  ];\n  let progress = 0, stageIdx = 0;\n  const tick = setInterval(() => {\n    progress = Math.min(100, progress + (Math.random()*6 + 4));\n    genFill.style.width = progress + '%';\n    genMeta.textContent = Math.round(progress) + '%';\n    const targetStage = Math.min(stages.length-1, Math.floor(progress/100 * stages.length));\n    if (targetStage !== stageIdx) {\n      stageIdx = targetStage;\n      genStage.textContent = stages[stageIdx] + ' ·';\n    }\n    if (progress >= 100) {\n      clearInterval(tick);\n      setTimeout(() => {\n        genBar.style.display = 'none';\n        // Build placeholder generated asset\n        const fakeAsset = {\n          id: 999,\n          name: prompt.split(',')[0].trim().slice(0, 38) || 'Generated asset',\n          category: 'Furniture',\n          tags: prompt.toLowerCase().split(/[\\s,]+/).filter(w => w.length>3).slice(0,3),\n          style: 'generated',\n          glyph: 'chair',\n          color: '#8a6a44'\n        };\n        genName.textContent = fakeAsset.name;\n        // Custom big thumb\n        genThumb.innerHTML = `<span class=\"badge\">Generated · ${(2 + Math.random()).toFixed(1)}s<\u002Fspan>` + thumbSvg(fakeAsset);\n        genResult.classList.add('show');\n      }, 200);\n    }\n  }, 110);\n  genInput.value = '';\n}\ngenSend.addEventListener('click', () => runGeneration(genInput.value));\ngenInput.addEventListener('keydown', e => {\n  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); runGeneration(genInput.value); }\n});\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
